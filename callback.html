<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected · CounterFactual</title><link rel="icon" href="icon.png">
<style>:root{--bg:#12182a;--fg:#eef1f7;--mut:#a9b2c6;--acc:#ffd23f}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}h1{font-size:30px;margin:0 0 8px}a{color:var(--acc)}p,li{color:var(--fg)}.mut{color:var(--mut)}nav a{margin-right:16px}
header{display:flex;align-items:center;gap:14px;margin-bottom:24px}header img{width:56px;height:56px;border-radius:12px}</style></head>
<body><main><header><img src="icon.png" alt=""><div><strong>CounterFactual</strong><div class="mut">You Decide History</div></div></header>
<h1 id="t">Login step done</h1>
<p id="msg">You can go back to Claude now.</p>
<div id="box" style="display:none"><p>Your one-time code (expires in a few minutes, useless without the app's secret key):</p>
<pre id="code" style="background:#0b1020;padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-all;font-size:15px"></pre>
<button id="cp" style="font-size:18px;padding:12px 20px;border-radius:10px;border:0;background:#ffd23f;color:#111;font-weight:700">Copy code</button></div>
<script>
const q=new URLSearchParams(location.search), c=q.get('code'), e=q.get('error');
if(c){document.getElementById('box').style.display='block';document.getElementById('code').textContent=c;
document.getElementById('msg').textContent='Copy the code below and send it to Claude.';
document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(c).then(()=>{document.getElementById('cp').textContent='Copied ✓'})};}
else if(e){document.getElementById('t').textContent='Login failed';document.getElementById('msg').textContent=e+': '+(q.get('error_description')||'');}
</script>
<p class="mut" style="margin-top:40px"><nav><a href="index.html">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></p></main></body></html>
